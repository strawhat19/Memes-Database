    <text x="64" y="193" fill="#6D6370" font-size="23">The dot overlaps the ivory M. Its color and size stay the same.</text>
    <path d="M64 232 H1536 M800 271 V922 M64 934 H1536" stroke="#DDD4D5" stroke-width="1"/>

