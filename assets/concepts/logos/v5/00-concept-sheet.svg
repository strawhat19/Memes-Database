<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="v5-sheet-title v5-sheet-desc">
  <title id="v5-sheet-title">Memes-Database — Green Dot Over the M Corner, v5</title>
  <desc id="v5-sheet-desc">Two nearby overlap placements of the selected radius-6.5 pistachio circle. Both draw the green circle on top of the ivory M at its upper-right corner, with most of the circle overlapping the letter. Corner Overlay centers at 118,33.5; Deeper Overlay centers at 117,35. The original geometry and palette remain unchanged.</desc>
