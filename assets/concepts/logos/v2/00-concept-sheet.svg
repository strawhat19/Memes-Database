<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="v2-sheet-title v2-sheet-desc">
  <title id="v2-sheet-title">Memes-Database — Archive Grin Letter and Palette Refinements, v2</title>
  <desc id="v2-sheet-desc">Three original refinements of the preferred Archive Grin concept: M Indexed Grin in indigo and coral, D Curve Grin in teal and apricot, and B Twin Pocket in rose and periwinkle. Each column shows a full-color mark, exact wordmark, palette, and simplified monochrome sample. Unadopted concepts for review.</desc>
