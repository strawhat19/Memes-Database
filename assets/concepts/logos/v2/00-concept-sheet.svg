      <use href="#mono-mark-3" transform="translate(1088 813) scale(.166667)"/>
      <text x="1144" y="836" fill="#6D6370" font-size="14" font-weight="650" letter-spacing="1.4">ONE COLOR / 32 PX</text>
      <text x="1088" y="881" font-size="18">Best fit: app icon or saved-content header</text>
      <text x="1088" y="907" fill="#6D6370" font-size="16">B-shaped two-pocket frame + a joyful face</text>
    </g>
