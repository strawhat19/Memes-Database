  <rect id="sheet-paper" width="1600" height="1000" fill="#FFF5ED"/>
  <g id="sheet-typography" fill="#25213D" font-family="'Avenir Next', Avenir, Arial, sans-serif">
    <text x="64" y="73" font-size="17" font-weight="650" letter-spacing="2.4">MEMES-DATABASE / ARCHIVE GRIN REFINEMENTS</text>
    <text x="1536" y="73" text-anchor="end" fill="#6D6370" font-size="17" letter-spacing="1.6">V2 · OCTOBER 2026</text>
    <text x="64" y="150" font-size="66" font-weight="750" letter-spacing="-2.4">Same grin. More character.</text>
    <text x="64" y="193" fill="#6D6370" font-size="23">The saved-card stack continues. M, D, and B become part of the archive.</text>
    <path d="M64 232 H1536 M544 271 V922 M1056 271 V922 M64 934 H1536" stroke="#DDD4D5" stroke-width="1"/>

    <g id="concept-column-01">
      <text x="64" y="293" font-size="27" font-weight="700" letter-spacing="-.5">01  M Indexed Grin</text>
      <text x="64" y="333" fill="#6D6370" font-size="19">A filing tab gives the stack its initial.</text>
      <text x="64" y="359" fill="#6D6370" font-size="19">Coral warmth. Indigo confidence.</text>
      <use href="#color-mark-1" transform="translate(173 391) scale(1.2)"/>
      <text x="288" y="689" text-anchor="middle" font-size="37" font-weight="750" letter-spacing="-1.3">Memes-Database</text>
      <circle cx="228" cy="728" r="7" fill="#FF785D"/><circle cx="252" cy="728" r="7" fill="#5040DC"/><circle cx="276" cy="728" r="7" fill="#B8B0F1"/>
      <text x="288" y="760" text-anchor="middle" fill="#6D6370" font-size="14" font-weight="650" letter-spacing=".3">CORAL #FF785D / INDIGO #5040DC</text>
      <path d="M64 790 H512" stroke="#DDD4D5"/>
      <use href="#mono-mark-1" transform="translate(64 813) scale(.166667)"/>
      <text x="120" y="836" fill="#6D6370" font-size="14" font-weight="650" letter-spacing="1.4">ONE COLOR / 32 PX</text>
      <text x="64" y="881" font-size="18">Best fit: app icon or collection avatar</text>
      <text x="64" y="907" fill="#6D6370" font-size="16">M index tab + the familiar front-card grin</text>
    </g>
    <g id="concept-column-02">
      <text x="576" y="293" font-size="27" font-weight="700" letter-spacing="-.5">02  D Curve Grin</text>
      <text x="576" y="333" fill="#6D6370" font-size="19">The D becomes the smiling card frame.</text>
      <text x="576" y="359" fill="#6D6370" font-size="19">Fresh teal. Sunny apricot.</text>
      <use href="#color-mark-2" transform="translate(685 391) scale(1.2)"/>
      <text x="800" y="689" text-anchor="middle" font-size="37" font-weight="750" letter-spacing="-1.3">Memes-Database</text>
      <circle cx="740" cy="728" r="7" fill="#087D79"/><circle cx="764" cy="728" r="7" fill="#FFB87D"/><circle cx="788" cy="728" r="7" fill="#A8D9CD"/>
      <text x="800" y="760" text-anchor="middle" fill="#6D6370" font-size="14" font-weight="650" letter-spacing=".3">TEAL #087D79 / APRICOT #FFB87D</text>
      <path d="M576 790 H1024" stroke="#DDD4D5"/>
      <use href="#mono-mark-2" transform="translate(576 813) scale(.166667)"/>
      <text x="632" y="836" fill="#6D6370" font-size="14" font-weight="650" letter-spacing="1.4">ONE COLOR / 32 PX</text>
      <text x="576" y="881" font-size="18">Best fit: catalog navigation or avatar</text>
      <text x="576" y="907" fill="#6D6370" font-size="16">D-shaped card frame + an open face window</text>
    </g>
    <g id="concept-column-03">
      <text x="1088" y="293" font-size="27" font-weight="700" letter-spacing="-.5">03  B Twin Pocket</text>
      <text x="1088" y="333" fill="#6D6370" font-size="19">Two archive pockets make a friendly B.</text>
      <text x="1088" y="359" fill="#6D6370" font-size="19">Confident rose. Soft periwinkle.</text>
      <use href="#color-mark-3" transform="translate(1197 391) scale(1.2)"/>
      <text x="1312" y="689" text-anchor="middle" font-size="37" font-weight="750" letter-spacing="-1.3">Memes-Database</text>
      <circle cx="1252" cy="728" r="7" fill="#CA416A"/><circle cx="1276" cy="728" r="7" fill="#99A3ED"/><circle cx="1300" cy="728" r="7" fill="#F1B6C8"/>
      <text x="1312" y="760" text-anchor="middle" fill="#6D6370" font-size="14" font-weight="650" letter-spacing=".3">ROSE #CA416A / PERIWINKLE #99A3ED</text>
