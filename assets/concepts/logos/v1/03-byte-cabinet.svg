    <rect x="104" y="48" width="48" height="48" rx="4" fill="#6938EF"/>
    <rect x="40" y="112" width="112" height="24" rx="4" fill="#BDA7FA"/>
    <path d="M60 66 H68 V74 H76 V82 H52 V74 H60Z" fill="#1D182A"/>
    <path d="M122 64 H134 V80 H122Z" fill="#FFF9F1"/>
