<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="byte-cabinet-title byte-cabinet-desc">
  <title id="byte-cabinet-title">Memes-Database — Byte Cabinet concept</title>
